name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Static client build exists
        run: test -f .output/public/index.html && test -f .output/public/learn/symptoms/index.html && test -f .output/public/learn/how-it-works/index.html && test -f .output/public/sitemap.xml && test -f .output/public/llms.txt && grep -q '<svg' .output/public/dashboard/index.html
